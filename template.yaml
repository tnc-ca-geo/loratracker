AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  SAM Template for Lambda-based IoT app

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3
    Runtime: python3.12

Parameters:
  StageName:
    Type: String
    Default: dev
  AgoClientSecret:
    Type: String
    Default: invalid

Resources:

  # Bucket for Web app code
  WebAppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "loratracker-${StageName}"
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebAppBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: "cloudfront.amazonaws.com"
            Action: "s3:GetObject"
            Resource: !Sub "${WebAppBucket.Arn}/*"
            # Condition:
            #  StringEquals:
            #    AWS::SourceArn: !Sub "arn:aws:cloudfront::Id-of-IAM-User:distribution/${CloudFrontDistribution}"

  WebAppCloudfrontDistroOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: "OAC for WebAppBucket"
        Name: static-hosting-OAC
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebAppCloudfrontDistro:
    # see https://canopas.com/deploy-a-website-with-aws-s3-cloudfront-using-cloudformation-c2199dc6c435
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Loratracking web app
        Origins:
          - DomainName: loratracker-prod.s3.us-west-1.amazonaws.com
            Id: !Sub "loratracker-${StageName}"
            OriginPath: /dist
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt WebAppCloudfrontDistroOriginAccessControl.Id
        Aliases:
          - lora-tracker.codefornature.org
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:957976798967:certificate/c44b3d3e-6b16-40dc-9870-b4ab046ac828
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
        DefaultCacheBehavior:
          Compress: true
          DefaultTTL: 86400
          MaxTTL: 31536000
          MinTTL: 0
          TargetOriginId: !Sub "loratracker-${StageName}"
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: "false"
            Cookies:
              Forward: none
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http1.1
        PriceClass: PriceClass_All

  IoTAPI:
    Type: AWS::Serverless::Api
    Properties:
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          Quota:
            Limit: 86400
            Period: DAY
          Throttle:
            BurstLimit: 100
            RateLimit: 50
          Tags:
            - Key: stack
              Value: !Ref AWS::StackName
      Description: Provides webhook for asset trackers to AGO
      StageName: !Ref StageName
      Tags:
        stack: !Ref AWS::StackName

  SharedLayer:
     Type: AWS::Serverless::LayerVersion
     Properties:
       LayerName: !Ref AWS::StackName
       ContentUri: layers
       CompatibleRuntimes:
         - python3.12
     Metadata:
       BuildMethod: python3.12
     RetentionPolicy: Delete

  WebhookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupClass: STANDARD
      LogGroupName: !Sub "/${AWS::StackName}/lambda/WebhookFunction"
      RetentionInDays: 1
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  WebhookFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: webhook/
      Description: An API to store IoT data
      Environment:
        Variables:
          AGO_CLIENT_SECRET: !Ref AgoClientSecret
      LoggingConfig:
        LogGroup: !Ref WebhookFunctionLogGroup

      Handler: app.lambda_handler
      Layers:
        - !Ref SharedLayer
      Events:
        NewData:
          Type: Api
          Properties:
            Method: post
            Path: /hook
            RestApiId: !Ref IoTAPI
            Auth:
              ApiKeyRequired: true
      Tags:
        stack: !Ref AWS::StackName

Outputs:
  # ATTENTION: The working of the integration tests depends on these values
  # ServerlessRestApi is an implicit API created out of Events key under
  # Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  StageName:
    Description: "Stage name"
    Value: !Ref StageName
  IoTApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${IoTAPI}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/hook/"
  IoTApiId:
    Description: "ID of the Webhook API"
    Value: !Ref IoTAPI
  WebHookFunction:
    Description: "Lambda Function ARN"
    Value: !GetAtt WebhookFunction.Arn
  WebHookFunctionIamRole:
    Description: "Implicit IAM Role created for Webhook function"
    Value: !GetAtt WebhookFunctionRole.Arn
